name: Publish MCP to npm

# Triggers on a version tag, e.g. v0.2.0 (mirrors the sheetlink CLI publish flow).
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Report vulnerabilities but don't block the release. The advisories here are in transitive
      # deps of @modelcontextprotocol/sdk's OPTIONAL HTTP server stack (hono, fast-uri, qs,
      # body-parser) — this server uses stdio transport only, so that code path never runs. Fixing
      # requires the SDK to update upstream. Keep the signal visible; upgrade the SDK when a patched
      # release lands. (Contrast: the CLI has no such transitive HTTP deps, so it hard-fails on high.)
      - name: Audit dependencies (report only)
        run: npm audit --audit-level=high || true

      - name: Build (tsc -> dist)
        run: npm run build

      - name: Dry run — verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
